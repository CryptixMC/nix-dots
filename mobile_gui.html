<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qubi Mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Qubi">

<style>
/* Custom properties, not hardcoded hex -- defaults here are the
   Ultraviolet palette (themes/ultraviolet/base16.yaml) so the page still
   looks right before the real theme loads (or if qubi/theme ever fails),
   but applyTheme() below overwrites every one of these from a live
   qubi/theme reply the moment the engine answers, same base16 role
   mapping the desktop shell's own ThemeDefaults.qml uses: base00 app bg,
   base01 panel bg, base02 card bg, base03 borders, base04 muted/disabled
   text, base05 body text, base06 labels/header, base07 text-on-accent,
   base08 critical/error, base0C signature accent. */
:root {
  --qubi-base00: #050505;
  --qubi-base01: #080808;
  --qubi-base02: #0f0f0f;
  --qubi-base03: #212121;
  --qubi-base04: #373737;
  --qubi-base05: #c8c8c8;
  --qubi-base06: #e0e0e0;
  --qubi-base07: #f5f5f5;
  --qubi-base08: #ff5de0;
  --qubi-accent: #b047ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
/* Desktop uses "JetBrainsMono Nerd Font Mono" (ThemeDefaults.qml) -- tried
   first in case it's ever installed on the phone, falling back to the
   closest system monospace stack rather than a plain sans-serif, closer
   to the desktop's identity without shipping font files over mobile data. */
body { font-family: "JetBrainsMono Nerd Font Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--qubi-base00); color: var(--qubi-base05); display: flex; flex-direction: column; }
#header { padding: 8px 12px; border-bottom: 1px solid var(--qubi-base03); font-size: 14px; color: var(--qubi-base06); flex-shrink: 0; }
#body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
#session-list { list-style: none; padding: 8px; }
#session-list li { padding: 12px 14px; margin: 4px 0; background: var(--qubi-base01); border-radius: 6px; cursor: pointer; font-size: 14px; border-left: 3px solid var(--qubi-base03); }
#session-list li.active { background: var(--qubi-accent); border-left-color: var(--qubi-accent); color: var(--qubi-base07); font-weight: bold; }
#session-list li:hover { background: var(--qubi-base02); }
#messages { flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 0; }
.msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
.msg.user { background: var(--qubi-accent); color: var(--qubi-base07); align-self: flex-end; margin-left: auto; }
.msg.agent { background: var(--qubi-base02); align-self: flex-start; }
.msg.thought { background: transparent; font-style: italic; color: var(--qubi-base04); padding-left: 24px; max-width: 85%; }
#input-bar { display: flex; border-top: 1px solid var(--qubi-base03); padding: 6px 8px; flex-shrink: 0; gap: 6px; background: var(--qubi-base01); }
#input-bar input { flex: 1; padding: 10px 12px; border-radius: 20px; border: 1px solid var(--qubi-base03); background: var(--qubi-base02); color: var(--qubi-base05); font-size: 15px; outline: none; }
#input-bar input:focus { border-color: var(--qubi-accent); }
#input-bar button { padding: 10px 18px; border-radius: 20px; border: none; background: var(--qubi-accent); color: var(--qubi-base07); font-size: 15px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
#input-bar button:disabled { opacity: 0.4; cursor: default; }
.error { color: var(--qubi-base08) !important; font-style: italic; }
#error-banner { display: none; background: var(--qubi-base08); color: var(--qubi-base00); padding: 10px 14px; font-size: 13px; font-weight: bold; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
#error-banner.show { display: flex; }
#error-banner button { background: transparent; border: none; color: var(--qubi-base00); font-size: 16px; font-weight: bold; cursor: pointer; line-height: 1; padding: 0 4px; }
#install-banner { display: none; background: var(--qubi-base02); border-bottom: 1px solid var(--qubi-base03); padding: 10px 14px; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; font-size: 13px; color: var(--qubi-base05); }
#install-banner.show { display: flex; }
#install-banner button { background: var(--qubi-accent); color: var(--qubi-base07); border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
#install-banner-dismiss { background: transparent !important; color: var(--qubi-base04) !important; font-size: 16px !important; padding: 0 4px !important; }
#new-chat-btn { background: var(--qubi-accent); color: var(--qubi-base07); }
</style>
</head>
<body>
<div id="header">Qubi Mobile — connected</div>
<!-- Real install button (beforeinstallprompt) on Chromium/Android; a
     manual-steps hint on iOS Safari, which has no such API at all -- the
     browser itself, not this page, decides whether either ever fires. -->
<div id="install-banner">
  <span id="install-banner-text">Install Qubi as an app for the full-screen experience.</span>
  <button id="install-banner-btn">Install</button>
  <button id="install-banner-dismiss" aria-label="Dismiss">×</button>
</div>
<div id="error-banner"><span id="error-banner-text"></span><button id="error-banner-close" aria-label="Dismiss">×</button></div>
<div id="body">
  <button id="new-chat-btn" style="margin:8px;padding:10px;border:none;border-radius:6px;font-size:14px;font-weight:bold;cursor:pointer;">New Chat</button>
  <ul id="session-list"><li>Loading sessions…</li></ul>
  <div id="messages"></div>
</div>
<div id="input-bar">
  <input type="text" id="msg-input" placeholder="Type a message…" autofocus autocomplete="off">
  <button id="send-btn" disabled>Send</button>
</div>

<script>
// Derived from how this page itself was loaded, not hardcoded -- works
// both direct (http://100.66.17.61:8901/, ws://100.66.17.61:8765, the
// pre-Serve setup) and behind `tailscale serve` (https://<tailnet-host>/,
// wss://<same host>/ws -- see BLOCKERS.md: Serve itself needs a one-time
// browser approval that couldn't be done non-interactively, so the /ws
// path specifically is unverified, but this at least stops the URL from
// silently breaking the moment Serve is enabled and the hostname changes).
var WS_URL = location.protocol === "https:"
  ? "wss://" + location.host + "/ws"
  : "ws://" + (location.hostname || "100.66.17.61") + ":8765";
var ws = null;
var nextId = 1;
var connGeneration = 0;  // stale-response protection for reconnects
var pendingMethods = {};  // requestId -> expected method after initialize completes
var currentSessionId = "";
var streamRole = null;   // role of the bubble currently being streamed into
var streamDiv = null;    // that bubble's element, or null if none is open
var busy = false;
var initialized = true;
var messagesEl = document.getElementById("messages");
var sessionList = document.getElementById("session-list");
var inputField = document.getElementById("msg-input");
var sendBtn = document.getElementById("send-btn");
var header = document.getElementById("header");
var errorBanner = document.getElementById("error-banner");
var errorBannerText = document.getElementById("error-banner-text");
var installBanner = document.getElementById("install-banner");
var installBannerText = document.getElementById("install-banner-text");
var installBannerBtn = document.getElementById("install-banner-btn");
var deferredInstallPrompt = null;

function setStatus(text) {
  header.textContent = text;
}

// base16 role -> the CSS custom property it drives (see the :root block's
// own comment for the full role mapping, shared with the desktop shell's
// ThemeDefaults.qml). qubi/theme's reply shape is {base16: {base00: "hex",
// ...}} with no leading "#" (confirmed by reading qubi_engine.py's
// _read_theme, which strips quotes off base16.yaml's raw values verbatim).
var THEME_ROLE_TO_VAR = {
  base00: "--qubi-base00", base01: "--qubi-base01", base02: "--qubi-base02",
  base03: "--qubi-base03", base04: "--qubi-base04", base05: "--qubi-base05",
  base06: "--qubi-base06", base07: "--qubi-base07", base08: "--qubi-base08",
  base0C: "--qubi-accent"
};

var HEX6 = /^[0-9a-fA-F]{6}$/;

function applyTheme(result) {
  var base16 = result && result.base16;
  if (!base16) return;
  var root = document.documentElement.style;
  // Every var() usage below has no CSS-side fallback, so a value that
  // isn't valid CSS at all makes the *whole declaration* invalid at
  // computed-value time (the property falls back to its initial value,
  // not to :root's default) -- confirmed live tonight against a real
  // pre-fix engine reply: body ended up with a fully transparent
  // background and black text, not the intended dark theme. Validating
  // the hex shape here, not just trusting the server, means a future
  // malformed qubi/theme reply degrades to "keeps the built-in
  // Ultraviolet default" instead of "breaks the whole page."
  for (var role in THEME_ROLE_TO_VAR) {
    var hex = base16[role];
    if (typeof hex === "string" && HEX6.test(hex)) root.setProperty(THEME_ROLE_TO_VAR[role], "#" + hex);
  }
  var themeColorMeta = document.querySelector('meta[name="theme-color"]');
  if (themeColorMeta && typeof base16.base00 === "string" && HEX6.test(base16.base00)) {
    themeColorMeta.setAttribute("content", "#" + base16.base00);
  }
}

// Real install flow: Chromium/Android fires beforeinstallprompt when this
// page meets installability criteria (served over HTTPS with a valid
// manifest -- see BLOCKERS.md/DECISIONS.md for why plain HTTP never
// triggers this at all, no matter what the manifest says). We suppress
// the browser's own default mini-infobar (preventDefault) and drive our
// own themed banner + button instead, calling .prompt() on click -- this
// IS the real native install dialog, not a fake button that just shows
// instructions.
var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone) installBanner.classList.add("show");
});

window.addEventListener("appinstalled", function () {
  deferredInstallPrompt = null;
  installBanner.classList.remove("show");
});

installBannerBtn.addEventListener("click", function () {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(function () {
    deferredInstallPrompt = null;
    installBanner.classList.remove("show");
  });
});

document.getElementById("install-banner-dismiss").addEventListener("click", function () {
  installBanner.classList.remove("show");
});

// iOS Safari has no beforeinstallprompt API at all -- "Add to Home
// Screen" only exists in the Share sheet, and no page can trigger it
// programmatically. Show instructions instead of a button that would
// never work.
if (isIOS && !isStandalone) {
  installBannerText.textContent = "Tap Share, then \"Add to Home Screen\" for the full-screen app.";
  installBannerBtn.style.display = "none";
  installBanner.classList.add("show");
}

function showError(text) {
  errorBannerText.textContent = text;
  errorBanner.classList.add("show");
}

function hideError() {
  errorBanner.classList.remove("show");
}

document.getElementById("error-banner-close").addEventListener("click", hideError);

function resetToSessionList() {
  currentSessionId = "";
  busy = false;
  initialized = true;
  messagesEl.innerHTML = "";
  sessionList.style.display = "";
  messagesEl.style.display = "";
  sendBtn.disabled = true;
  inputField.placeholder = "Select a session…";
  loadSessions();
}

function addMsg(role, text) {
  var chunk = (text !== null && text !== undefined) ? text.replace(/\n+$/, "") : "";
  if (!chunk.length) return;

  // Consecutive chunks of the same streaming role (agent/thought) append
  // to the same bubble instead of each becoming a separate message.
  if ((role === "agent" || role === "thought") && streamRole === role && streamDiv) {
    streamDiv.textContent += chunk;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return;
  }

  var div = document.createElement("div");
  div.className = "msg" + (role === "user" ? " user" : (role === "thought" ? " thought" : " agent"));
  div.textContent = chunk;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  if (role === "agent" || role === "thought") {
    streamRole = role;
    streamDiv = div;
  } else {
    streamRole = null;
    streamDiv = null;
  }
}

function wsSend(obj) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return false;
  ws.send(JSON.stringify(obj));
  return true;
}

function init() {
  setStatus("Connecting…");
  var gen = ++connGeneration;  // new generation for this connection
  ws = new WebSocket(WS_URL);
  ws.onopen = function () {
    pendingMethods = {};  // reset pending on reconnect
    setStatus("Connected. Initializing…");
    var initId = nextId++;
    pendingMethods[initId] = "initialize";
    wsSend({ jsonrpc: "2.0", id: initId, method: "initialize", params: { protocolVersion: 1, clientCapabilities: {} } });
    // No name param -- qubi/theme without one reads the engine's live
    // active theme (~/.config/qubi/config.json's own "theme" key), same
    // theme the desktop shell is showing, not a hardcoded Ultraviolet
    // assumption. Independent of ACP init state, so fired in parallel.
    var themeId = nextId++;
    pendingMethods[themeId] = "qubi/theme";
    wsSend({ jsonrpc: "2.0", id: themeId, method: "qubi/theme", params: {} });
  };
  ws.onerror = function () { setStatus("WebSocket error"); };
  ws.onclose = function (ev) {
    connGeneration++;  // invalidate pending on disconnect
    setStatus("Disconnected (code " + ev.code + ")");
    // brief reconnect backoff
    setTimeout(init, 2000);
  };
  ws.onmessage = function (ev) {
    handleRaw(ev.data);
  };
}

function handleRaw(raw) {
  var obj;
  try { obj = JSON.parse(raw); } catch (_) { return; }
  if (!obj || typeof obj !== "object") return;

  // Stale response from old connection? Ignore.
  if (connGeneration === undefined) return;

  // Check if this is an error response for our initialize call
  if (obj.error && obj.id === 1) {
    showError("Initialize failed: " + JSON.stringify(obj.error));
    // still list sessions since the server is live
    resetToSessionList();
    return;
  }

  // Error response to one of our own tracked requests: recover the UI
  // instead of leaving it permanently disabled.
  if (obj.error && obj.id !== undefined && pendingMethods[obj.id]) {
    var failedMethod = pendingMethods[obj.id];
    delete pendingMethods[obj.id];
    var errText = obj.error.message || JSON.stringify(obj.error);
    if (failedMethod === "session/load") {
      showError("Couldn't load that session: " + errText);
      resetToSessionList();
    } else if (failedMethod === "session/new") {
      showError("Couldn't start a new chat: " + errText);
      resetToSessionList();
    } else if (failedMethod === "session/prompt") {
      busy = false;
      sendBtn.disabled = false;
      showError("Message failed: " + errText);
    } else {
      showError(failedMethod + " failed: " + errText);
    }
    return;
  }

  // Response with result to one of our own requests (no method field in response)
  if (obj.result !== undefined && obj.id !== undefined && pendingMethods[obj.id]) {
    var expectMethod = pendingMethods[obj.id];
    delete pendingMethods[obj.id];
    if (expectMethod === "initialize") {
      loadSessions();
      return;
    }
    if (expectMethod === "qubi/theme") {
      applyTheme(obj.result);
      return;
    }
    if (expectMethod === "session/list") {
      renderSessions(obj.result);
      return;
    }
    if (expectMethod === "session/load") {
      onSessionLoaded(obj.result);
      return;
    }
    if (expectMethod === "session/new") {
      currentSessionId = obj.result.sessionId || "";
      onSessionLoaded(obj.result);
      return;
    }
    if (expectMethod === "session/prompt") {
      busy = false;
      sendBtn.disabled = false;
      return;
    }
  }

  // Notification we care about during an active session
  if (obj.method && obj.method === "session/update") {
    var upd = obj.params && obj.params.update;
    if (!upd) return;
    switch (upd.sessionUpdate) {
      case "agent_message_chunk":
        addMsg("agent", upd.content ? upd.content.text : "");
        break;
      case "user_message_chunk":
        addMsg("user", upd.content ? upd.content.text : "");
        break;
      case "thought_message_chunk":
        // NixOS config uses thought_message_chunk for agent_thought
        addMsg("thought", upd.content ? upd.content.text : "");
        break;
      default:
        // other updates (tool_call, tool_call_update, current_mode_update)
        // silently acknowledged for now
        break;
    }
    return;
  }

  // Handle errors not caught in the result branch
  if (obj.error && obj.id !== undefined) {
    addMsg("agent", "[Error] " + JSON.stringify(obj.error));
  }
}

function renderSessions(result) {
  var sessions = result.sessions || [];
  sessionList.innerHTML = "";
  if (!sessions.length) {
    var li = document.createElement("li");
    li.textContent = "No sessions";
    sessionList.appendChild(li);
    return;
  }
  for (var i = 0; i < sessions.length; i++) {
    (function (s) {
      var li = document.createElement("li");
      var title = s.title || s.description || "(untitled)";
      li.textContent = title;
      li.addEventListener("click", function () {
        // remove active from all
        for (var j = 0; j < sessionList.children.length; j++) {
          sessionList.children[j].classList.remove("active");
        }
        li.classList.add("active");
        loadSession(s.sessionId);
      });
      sessionList.appendChild(li);
    })(sessions[i]);
  }
}

function onSessionLoaded(result) {
  busy = false;
  sendBtn.disabled = false;
  inputField.placeholder = "Type a message…";
  setStatus("Chatting: " + currentSessionId);
  addMsg("agent", "Session loaded.");
  // clear messages since this is a fresh load
  // (historyMessage signals would come from server during session/load replay)
}

function loadSessions() {
  var id = nextId++;
  pendingMethods[id] = "session/list";
  var req = { jsonrpc: "2.0", id: id, method: "session/list", params: {} };
  wsSend(req);
}

function loadSession(sessionId) {
  hideError();
  currentSessionId = sessionId;
  busy = true;
  sessionList.style.display = "none";
  messagesEl.innerHTML = "";
  streamRole = null;
  streamDiv = null;
  setStatus("Loading session…");
  var id = nextId++;
  pendingMethods[id] = "session/load";
  var req = { jsonrpc: "2.0", id: id, method: "session/load", params: { sessionId: sessionId, cwd: "/home/cryptix/nix-dots", mcpServers: [] } };
  wsSend(req);
}

function newChat() {
  hideError();
  sessionList.style.display = "none";
  messagesEl.innerHTML = "";
  streamRole = null;
  streamDiv = null;
  busy = true;
  setStatus("Creating new session…");
  var id = nextId++;
  pendingMethods[id] = "session/new";
  var req = { jsonrpc: "2.0", id: id, method: "session/new", params: { cwd: "/home/cryptix/nix-dots", mcpServers: [] } };
  wsSend(req);
}

function sendMessage() {
  var text = inputField.value.trim();
  if (!text || busy) return;
  hideError();
  busy = true;
  sendBtn.disabled = true;
  addMsg("user", text);
  inputField.value = "";
  var id = nextId++;
  pendingMethods[id] = "session/prompt";
  var req = { jsonrpc: "2.0", id: id, method: "session/prompt", params: { sessionId: currentSessionId, prompt: [{ type: "text", text: text }] } };
  wsSend(req);
}

document.getElementById("new-chat-btn").addEventListener("click", newChat);

inputField.addEventListener("keydown", function (e) {
  if (e.key === "Enter") sendMessage();
});
sendBtn.addEventListener("click", sendMessage);

// kick off
init();
</script>
</body>
</html>
