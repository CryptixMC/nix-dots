scheme: "Catppuccin Mocha"
author: "Catppuccin (https://github.com/catppuccin/catppuccin), hand-mapped to this repo's own base16 slot convention (base0C = primary accent, matching themes/ultraviolet)"

# Dark backgrounds — Mocha's own elevation stair
base00: "1e1e2e"   # Base
base01: "181825"   # Mantle
base02: "313244"   # Surface0
base03: "45475a"   # Surface1
base04: "585b70"   # Surface2

# Text tones
base05: "cdd6f4"   # Text
base06: "f5e0dc"   # Rosewater
base07: "b4befe"   # Lavender

# Accent ramp — red/peach/yellow/green, mauve as the primary interactive
# accent (base0C), matching themes/ultraviolet's own slot convention
base08: "f38ba8"   # Red — critical / brand pop
base09: "fab387"   # Peach
base0A: "f9e2af"   # Yellow
base0B: "a6e3a1"   # Green
base0C: "cba6f7"   # Mauve — primary interactive
base0D: "89b4fa"   # Blue
base0E: "94e2d5"   # Teal
base0F: "f2cdcd"   # Flamingo
