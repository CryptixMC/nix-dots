name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The private qubi input isn't fetchable here, so this runs the checks
      # that don't need it rather than a full `nix flake check`.
      - name: Qubi boundary guard
        run: nix build --print-build-logs .#checks.x86_64-linux.qubi-boundary-guard
      - name: Formatting
        run: git ls-files -z '*.nix' | xargs -0 nix run .#formatter.x86_64-linux -- --check
