name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # pytest (inside the package build), ruff, qmllint, and the two
      # structural checks (self-contained QML, no host-specific paths).
      - run: nix flake check -L
