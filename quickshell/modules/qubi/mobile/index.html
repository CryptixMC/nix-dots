<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qubi Mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Qubi">

<style>
/* Custom properties, not hardcoded hex -- defaults here are the
   Ultraviolet palette (themes/ultraviolet/base16.yaml) so the page still
   looks right before the real theme loads (or if qubi/theme ever fails),
   but applyTheme() below overwrites every one of these from a live
   qubi/theme reply the moment the engine answers, same base16 role
   mapping the desktop shell's own ThemeDefaults.qml uses: base00 app bg,
   base01 panel bg, base02 card bg, base03 borders, base04 muted/disabled
   text, base05 body text, base06 labels/header, base07 text-on-accent,
   base08 critical/error, base0C signature accent. */
:root {
  --qubi-base00: #050505;
  --qubi-base01: #080808;
  --qubi-base02: #0f0f0f;
  --qubi-base03: #212121;
  --qubi-base04: #373737;
  --qubi-base05: #c8c8c8;
  --qubi-base06: #e0e0e0;
  --qubi-base07: #f5f5f5;
  --qubi-base08: #ff5de0;
  --qubi-accent: #b047ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
/* Desktop uses "JetBrainsMono Nerd Font Mono" (ThemeDefaults.qml) -- tried
   first in case it's ever installed on the phone, falling back to the
   closest system monospace stack rather than a plain sans-serif, closer
   to the desktop's identity without shipping font files over mobile data. */
body { font-family: "JetBrainsMono Nerd Font Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--qubi-base00); color: var(--qubi-base05); display: flex; flex-direction: column; }

#header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--qubi-base03); flex-shrink: 0; }
#header button { background: transparent; border: none; color: var(--qubi-base05); font-size: 18px; padding: 4px 8px; cursor: pointer; font-family: inherit; }
#header-title { flex: 1; font-size: 14px; color: var(--qubi-base06); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#header-status { font-size: 11px; color: var(--qubi-base04); flex-shrink: 0; }

.view { flex: 1; min-height: 0; display: none; flex-direction: column; }
.view.active { display: flex; }

#new-chat-btn { margin: 8px; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; background: var(--qubi-accent); color: var(--qubi-base07); flex-shrink: 0; }
#session-list { list-style: none; padding: 8px; overflow-y: auto; flex: 1; }
#session-list li { padding: 10px 14px; margin: 4px 0; background: var(--qubi-base01); border-radius: 6px; cursor: pointer; border-left: 3px solid var(--qubi-base03); }
#session-list li.active { background: var(--qubi-accent); border-left-color: var(--qubi-accent); color: var(--qubi-base07); }
#session-list .session-title { font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#session-list .session-meta { font-size: 11px; color: var(--qubi-base04); margin-top: 2px; }
#session-list li.active .session-meta { color: var(--qubi-base07); opacity: 0.75; }

#messages { flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 0; }
.msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; max-width: 88%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
.msg.user { background: var(--qubi-accent); color: var(--qubi-base07); margin-left: auto; }
.msg.agent { background: var(--qubi-base02); }
.msg.thought { background: transparent; font-style: italic; color: var(--qubi-base04); padding-left: 20px; max-width: 92%; }
.msg.tool { background: transparent; font-style: italic; color: var(--qubi-base04); font-size: 12px; max-width: 100%; }
.msg.system { background: transparent; color: var(--qubi-base04); font-size: 12px; text-align: center; max-width: 100%; }

/* Code blocks split out of a message's fenced segments -- same reasoning
   as the desktop overlay's splitSegments(): there is no code-block
   styling to configure in plain rendering, so fences are found and
   rendered as their own surface by hand. */
.code-block { background: var(--qubi-base00); border: 1px solid var(--qubi-base03); border-radius: 6px; margin: 6px 0; overflow: hidden; }
.code-block .code-header { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 11px; color: var(--qubi-base04); border-bottom: 1px solid var(--qubi-base03); }
.code-block .code-copy { cursor: pointer; }
.code-block .code-copy.copied { color: var(--qubi-accent); }
.code-block pre { padding: 8px; margin: 0; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }

.banner { margin: 6px 12px; padding: 10px 12px; border-radius: 8px; background: var(--qubi-base01); border: 1px solid var(--qubi-accent); flex-shrink: 0; }
.banner .banner-text { font-size: 13px; margin-bottom: 8px; }
.banner .banner-options { display: flex; flex-wrap: wrap; gap: 6px; }
.banner .banner-options button { padding: 6px 12px; border-radius: 14px; border: 1px solid var(--qubi-base03); background: var(--qubi-base02); color: var(--qubi-base05); font-size: 12px; font-family: inherit; cursor: pointer; }

#turn-actions { display: flex; justify-content: flex-end; gap: 12px; padding: 2px 12px; font-size: 12px; color: var(--qubi-base04); flex-shrink: 0; }
#turn-actions span { cursor: pointer; }
#turn-actions span:active { color: var(--qubi-accent); }

#slash-popup { margin: 0 8px 4px; background: var(--qubi-base01); border: 1px solid var(--qubi-base03); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
#slash-popup .slash-row { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 13px; }
#slash-popup .slash-row .slash-name { color: var(--qubi-accent); }
#slash-popup .slash-row .slash-help { color: var(--qubi-base04); font-size: 11px; }

#input-bar { display: flex; align-items: flex-end; border-top: 1px solid var(--qubi-base03); padding: 6px 8px; flex-shrink: 0; gap: 6px; background: var(--qubi-base01); }
#msg-input { flex: 1; padding: 10px 12px; border-radius: 16px; border: 1px solid var(--qubi-base03); background: var(--qubi-base02); color: var(--qubi-base05); font-size: 15px; outline: none; font-family: inherit; resize: none; max-height: 120px; overflow-y: auto; line-height: 1.3; }
#msg-input:focus { border-color: var(--qubi-accent); }
#send-btn { padding: 10px 16px; border-radius: 10px; border: none; background: var(--qubi-base02); color: var(--qubi-base05); font-size: 15px; font-weight: bold; cursor: pointer; flex-shrink: 0; font-family: inherit; }
#send-btn.ready { background: var(--qubi-accent); color: var(--qubi-base07); }
#send-btn:disabled { opacity: 0.4; cursor: default; }

#status-bar { display: flex; justify-content: space-between; padding: 4px 12px 8px; font-size: 11px; color: var(--qubi-base04); flex-shrink: 0; }
#status-bar span { cursor: pointer; }

.error { color: var(--qubi-base08) !important; font-style: italic; }
#error-banner { display: none; background: var(--qubi-base08); color: var(--qubi-base00); padding: 10px 14px; font-size: 13px; font-weight: bold; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
#error-banner.show { display: flex; }
#error-banner button { background: transparent; border: none; color: var(--qubi-base00); font-size: 16px; font-weight: bold; cursor: pointer; line-height: 1; padding: 0 4px; }
#install-banner { display: none; background: var(--qubi-base02); border-bottom: 1px solid var(--qubi-base03); padding: 10px 14px; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; font-size: 13px; color: var(--qubi-base05); }
#install-banner.show { display: flex; }
#install-banner button { background: var(--qubi-accent); color: var(--qubi-base07); border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
#install-banner-dismiss { background: transparent !important; color: var(--qubi-base04) !important; font-size: 16px !important; padding: 0 4px !important; }

/* Small centered overlay for the tier picker / MCP list -- same job as
   the desktop panel's floating pickers, sized for a thumb tap instead of
   a mouse click. */
#modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10; align-items: center; justify-content: center; }
#modal-backdrop.show { display: flex; }
#modal-box { background: var(--qubi-base01); border: 1px solid var(--qubi-base03); border-radius: 10px; width: 85%; max-width: 320px; max-height: 70%; overflow-y: auto; }
#modal-box .modal-title { padding: 12px 14px; font-size: 13px; font-weight: bold; color: var(--qubi-base06); border-bottom: 1px solid var(--qubi-base03); }
#modal-box .modal-row { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--qubi-base03); }
#modal-box .modal-row:last-child { border-bottom: none; }
#modal-box .modal-row.selectable { cursor: pointer; }
#modal-box .modal-row.active { background: var(--qubi-accent); color: var(--qubi-base07); }
#modal-box .modal-row .modal-sub { font-size: 11px; color: var(--qubi-base04); margin-top: 2px; }
#modal-box .modal-row.active .modal-sub { color: var(--qubi-base07); opacity: 0.75; }
</style>
</head>
<body>
<div id="header">
  <button id="back-btn" aria-label="Sessions">☰</button>
  <div id="header-title">Qubi</div>
  <div id="header-status">connecting…</div>
</div>
<!-- Real install button (beforeinstallprompt) on Chromium/Android; a
     manual-steps hint on iOS Safari, which has no such API at all -- the
     browser itself, not this page, decides whether either ever fires. -->
<div id="install-banner">
  <span id="install-banner-text">Install Qubi as an app for the full-screen experience.</span>
  <button id="install-banner-btn">Install</button>
  <button id="install-banner-dismiss" aria-label="Dismiss">×</button>
</div>
<div id="error-banner"><span id="error-banner-text"></span><button id="error-banner-close" aria-label="Dismiss">×</button></div>

<div id="sessions-view" class="view active">
  <button id="new-chat-btn">New Chat</button>
  <ul id="session-list"><li>Loading sessions…</li></ul>
</div>

<div id="chat-view" class="view">
  <div id="messages"></div>
  <div id="permission-banner" class="banner" style="display:none;">
    <div class="banner-text" id="permission-text"></div>
    <div class="banner-options" id="permission-options"></div>
  </div>
  <div id="escalation-banner" class="banner" style="display:none;">
    <div class="banner-text" id="escalation-text"></div>
    <div class="banner-options">
      <button data-option="escalate_claude">Escalate to Claude</button>
      <button data-option="escalate_heavy_local">Escalate to heavy</button>
      <button data-option="decline">Stay on light</button>
    </div>
  </div>
  <div id="turn-actions">
    <span id="regenerate-btn" style="display:none;">regenerate</span>
    <span id="stop-btn" style="display:none;">stop</span>
  </div>
  <div id="slash-popup" style="display:none;"></div>
  <div id="input-bar">
    <textarea id="msg-input" placeholder="Type a message…" autocomplete="off" rows="1"></textarea>
    <button id="send-btn" disabled>Send</button>
  </div>
  <div id="status-bar">
    <span id="mcp-status">⚙ … MCP</span>
    <span id="tier-status">…</span>
  </div>
</div>

<div id="modal-backdrop">
  <div id="modal-box"></div>
</div>

<script>
// Derived from how this page itself was loaded, not hardcoded -- works
// both direct (http://<host>:8901/, ws://<host>:8765, the
// pre-Serve setup) and behind `tailscale serve` (https://<tailnet-host>/,
// wss://<same host>/ws -- see BLOCKERS.md: Serve itself needs a one-time
// browser approval that couldn't be done non-interactively, so the /ws
// path specifically is unverified, but this at least stops the URL from
// silently breaking the moment Serve is enabled and the hostname changes).
var WS_URL = location.protocol === "https:"
  ? "wss://" + location.host + "/ws"
  : "ws://" + (location.hostname || "127.0.0.1") + ":8765";
var ws = null;
var nextId = 1;
var connGeneration = 0;  // stale-response protection for reconnects
var pendingMethods = {};  // requestId -> expected method
var currentSessionId = "";
var streamRole = null;   // role of the bubble currently being streamed into
var streamDiv = null;    // that bubble's element, or null if none is open
var busy = false;
// Source of truth for the open conversation -- needed for regenerate()
// to find and truncate at the last user turn, same as the desktop
// overlay's ChatState.messages. DOM divs alone can't be un-rendered
// cleanly enough to redo a turn.
var messages = [];
var currentTier = "light";
var tierModels = {};  // tierName -> model, from qubi/status
// Working directory for session/new and session/load, reported by the
// engine (qubi/status.defaultCwd) -- this page has no filesystem to ask.
var defaultCwd = "/";
// Major version of the qubi/* protocol this page speaks; compared with
// qubi/status.protocol.major (python/src/qubi/protocol.py).
var PROTOCOL_MAJOR = 1;
var pendingPermission = null;   // raw session/request_permission object
var pendingEscalation = null;   // raw qubi/escalation_offer params

var messagesEl = document.getElementById("messages");
var sessionList = document.getElementById("session-list");
var inputField = document.getElementById("msg-input");
var sendBtn = document.getElementById("send-btn");
var headerTitle = document.getElementById("header-title");
var headerStatus = document.getElementById("header-status");
var backBtn = document.getElementById("back-btn");
var sessionsView = document.getElementById("sessions-view");
var chatView = document.getElementById("chat-view");
var errorBanner = document.getElementById("error-banner");
var errorBannerText = document.getElementById("error-banner-text");
var installBanner = document.getElementById("install-banner");
var installBannerText = document.getElementById("install-banner-text");
var installBannerBtn = document.getElementById("install-banner-btn");
var deferredInstallPrompt = null;
var permissionBanner = document.getElementById("permission-banner");
var escalationBanner = document.getElementById("escalation-banner");
var regenerateBtn = document.getElementById("regenerate-btn");
var stopBtn = document.getElementById("stop-btn");
var slashPopup = document.getElementById("slash-popup");
var mcpStatus = document.getElementById("mcp-status");
var tierStatus = document.getElementById("tier-status");
var modalBackdrop = document.getElementById("modal-backdrop");
var modalBox = document.getElementById("modal-box");

function setStatus(text) {
  headerStatus.textContent = text;
}

function showView(name) {
  sessionsView.classList.toggle("active", name === "sessions");
  chatView.classList.toggle("active", name === "chat");
  backBtn.textContent = name === "chat" ? "‹" : "☰";
  headerTitle.textContent = name === "chat" ? "Qubi" : "Sessions";
}

// The hamburger doubles as a back button once a chat is open -- there was
// previously no way back to the session list at all short of reloading
// the page (resetToSessionList() existed but nothing ever called it).
backBtn.addEventListener("click", function () {
  if (chatView.classList.contains("active")) {
    showView("sessions");
    loadSessions();
  } else {
    showView("sessions");
  }
});

// base16 role -> the CSS custom property it drives (see the :root block's
// own comment for the full role mapping, shared with the desktop shell's
// ThemeDefaults.qml). qubi/theme's reply shape is {base16: {base00: "hex",
// ...}} with no leading "#" (confirmed by reading qubi_engine.py's
// _read_theme, which strips quotes off base16.yaml's raw values verbatim).
var THEME_ROLE_TO_VAR = {
  base00: "--qubi-base00", base01: "--qubi-base01", base02: "--qubi-base02",
  base03: "--qubi-base03", base04: "--qubi-base04", base05: "--qubi-base05",
  base06: "--qubi-base06", base07: "--qubi-base07", base08: "--qubi-base08",
  base0C: "--qubi-accent"
};

var HEX6 = /^[0-9a-fA-F]{6}$/;

function applyTheme(result) {
  var base16 = result && result.base16;
  if (!base16) return;
  var root = document.documentElement.style;
  // Every var() usage below has no CSS-side fallback, so a value that
  // isn't valid CSS at all makes the *whole declaration* invalid at
  // computed-value time (the property falls back to its initial value,
  // not to :root's default) -- confirmed live tonight against a real
  // pre-fix engine reply: body ended up with a fully transparent
  // background and black text, not the intended dark theme. Validating
  // the hex shape here, not just trusting the server, means a future
  // malformed qubi/theme reply degrades to "keeps the built-in
  // Ultraviolet default" instead of "breaks the whole page."
  for (var role in THEME_ROLE_TO_VAR) {
    var hex = base16[role];
    if (typeof hex === "string" && HEX6.test(hex)) root.setProperty(THEME_ROLE_TO_VAR[role], "#" + hex);
  }
  var themeColorMeta = document.querySelector('meta[name="theme-color"]');
  if (themeColorMeta && typeof base16.base00 === "string" && HEX6.test(base16.base00)) {
    themeColorMeta.setAttribute("content", "#" + base16.base00);
  }
}

// Real install flow: Chromium/Android fires beforeinstallprompt when this
// page meets installability criteria (served over HTTPS with a valid
// manifest -- see BLOCKERS.md/DECISIONS.md for why plain HTTP never
// triggers this at all, no matter what the manifest says). We suppress
// the browser's own default mini-infobar (preventDefault) and drive our
// own themed banner + button instead, calling .prompt() on click -- this
// IS the real native install dialog, not a fake button that just shows
// instructions.
var isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone) installBanner.classList.add("show");
});

window.addEventListener("appinstalled", function () {
  deferredInstallPrompt = null;
  installBanner.classList.remove("show");
});

installBannerBtn.addEventListener("click", function () {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(function () {
    deferredInstallPrompt = null;
    installBanner.classList.remove("show");
  });
});

document.getElementById("install-banner-dismiss").addEventListener("click", function () {
  installBanner.classList.remove("show");
});

// iOS Safari has no beforeinstallprompt API at all -- "Add to Home
// Screen" only exists in the Share sheet, and no page can trigger it
// programmatically. Show instructions instead of a button that would
// never work.
if (isIOS && !isStandalone) {
  installBannerText.textContent = "Tap Share, then \"Add to Home Screen\" for the full-screen app.";
  installBannerBtn.style.display = "none";
  installBanner.classList.add("show");
}

function showError(text) {
  errorBannerText.textContent = text;
  errorBanner.classList.add("show");
}

function hideError() {
  errorBanner.classList.remove("show");
}

document.getElementById("error-banner-close").addEventListener("click", hideError);

function closeModal() {
  modalBackdrop.classList.remove("show");
  modalBox.innerHTML = "";
}
modalBackdrop.addEventListener("click", function (e) {
  if (e.target === modalBackdrop) closeModal();
});

// ---- code-block splitting ----------------------------------------------
// Same job as the desktop overlay's splitSegments(): break a message into
// alternating prose / fenced-code segments so code gets its own surface
// and a copy button, since plain text rendering draws a fence as
// undifferentiated body text. An unterminated trailing fence renders as
// prose on purpose -- a streaming reply is mid-block on nearly every
// turn, and promoting that to a code block would flicker the bubble
// between two layouts as text arrives.
// A whole fenced block on one line (```lang content```, no newlines) is
// real, observed model output -- not hypothetical: a live "just answer
// with the number" turn tonight replied with exactly "```python42```"
// on a single line. The line-based state machine below assumes an
// opening fence is always alone on its own line; fed a self-contained
// single-line block, it consumed the whole line as an "open" marker
// (with everything after the first ``` -- including the closing ``` --
// swallowed into `lang`) and never found a matching close, so the reply
// silently rendered as nothing at all. Checked and stripped out first,
// before the multi-line state machine ever sees the line.
//
// Two patterns, tried in order, because a lone greedy \S* is genuinely
// ambiguous here: against "```python42```" it happily consumes the
// whole "python42" as the language name and leaves the content empty,
// since nothing marks where the language tag ends and content begins.
// WITH_LANG requires real whitespace between them (the common case:
// ```python print('hi')```), so it can never misfire on the ambiguous
// input -- \s+ has nothing to match without an actual space. BARE is
// the fallback with no separator at all: treat the whole interior as
// content and don't guess at a language, so a compact reply like
// "```python42```" renders its real text instead of silently vanishing
// into a mislabelled empty block.
var SINGLE_LINE_FENCE_WITH_LANG = /^\s*```(\S+)\s+([\s\S]*?)```\s*$/;
var SINGLE_LINE_FENCE_BARE = /^\s*```([\s\S]*?)```\s*$/;

function matchSingleLineFence(line) {
  var m = line.match(SINGLE_LINE_FENCE_WITH_LANG);
  if (m) return { lang: m[1], text: m[2] };
  m = line.match(SINGLE_LINE_FENCE_BARE);
  if (m) return { lang: "", text: m[1] };
  return null;
}

function splitSegments(src) {
  var lines = (src || "").split("\n");
  var segs = [];
  var buf = [];
  var inCode = false;
  var lang = "";
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (!inCode) {
      var single = matchSingleLineFence(line);
      if (single) {
        if (buf.length > 0) { segs.push({ code: false, text: buf.join("\n") }); buf = []; }
        segs.push({ code: true, lang: single.lang, text: single.text });
        continue;
      }
    }
    if (/^\s*```/.test(line)) {
      if (!inCode) {
        if (buf.length > 0) segs.push({ code: false, text: buf.join("\n") });
        buf = [];
        inCode = true;
        lang = line.trim().slice(3).trim();
      } else {
        segs.push({ code: true, lang: lang, text: buf.join("\n") });
        buf = [];
        inCode = false;
        lang = "";
      }
      continue;
    }
    buf.push(line);
  }
  if (buf.length > 0) {
    var tail = inCode ? "```" + lang + "\n" + buf.join("\n") : buf.join("\n");
    segs.push({ code: false, text: tail });
  }
  return segs.filter(function (s) { return s.code || s.text.trim().length > 0; });
}

function copyText(text, btn) {
  function marked() {
    if (!btn) return;
    var was = btn.textContent;
    btn.textContent = "copied";
    btn.classList.add("copied");
    setTimeout(function () { btn.textContent = was; btn.classList.remove("copied"); }, 1200);
  }
  // Clipboard API needs a secure context (HTTPS or localhost) -- this page
  // is explicitly designed to also work over plain HTTP on the tailnet
  // (see WS_URL's own comment), where navigator.clipboard is simply
  // absent. Fall back to the legacy execCommand path rather than the
  // button silently doing nothing.
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(marked).catch(function () { legacyCopy(text, marked); });
  } else {
    legacyCopy(text, marked);
  }
}

function legacyCopy(text, onDone) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand("copy"); if (onDone) onDone(); } catch (e) {}
  document.body.removeChild(ta);
}

function renderMessageBody(container, role, text) {
  container.innerHTML = "";
  if (role === "tool" || role === "system") {
    container.textContent = text;
    return;
  }
  if (role === "thought") {
    container.textContent = text;
    return;
  }
  var segments = splitSegments(text);
  if (segments.length === 0) return;
  segments.forEach(function (seg) {
    if (!seg.code) {
      var p = document.createElement("div");
      p.style.whiteSpace = "pre-wrap";
      p.textContent = seg.text;
      container.appendChild(p);
      return;
    }
    var block = document.createElement("div");
    block.className = "code-block";
    var head = document.createElement("div");
    head.className = "code-header";
    var langLabel = document.createElement("span");
    langLabel.textContent = seg.lang && seg.lang.length > 0 ? seg.lang : "code";
    var copyBtn = document.createElement("span");
    copyBtn.className = "code-copy";
    copyBtn.textContent = "copy";
    copyBtn.addEventListener("click", function () { copyText(seg.text, copyBtn); });
    head.appendChild(langLabel);
    head.appendChild(copyBtn);
    var pre = document.createElement("pre");
    pre.textContent = seg.text;
    block.appendChild(head);
    block.appendChild(pre);
    container.appendChild(block);
  });
}

// ---- messages ------------------------------------------------------------

function addMsg(role, text) {
  var chunk = (text !== null && text !== undefined) ? text.replace(/\n+$/, "") : "";
  if (!chunk.length) return;

  // Consecutive chunks of the same streaming role (agent/thought) append
  // to the same bubble AND the same messages[] entry, instead of each
  // becoming a separate message.
  if ((role === "agent" || role === "thought") && streamRole === role && streamDiv) {
    var entry = messages[messages.length - 1];
    entry.text += chunk;
    renderMessageBody(streamDiv, role, entry.text);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return;
  }

  var div = document.createElement("div");
  div.className = "msg " + role;
  messagesEl.appendChild(div);
  messages.push({ role: role, text: chunk });
  renderMessageBody(div, role, chunk);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  if (role === "agent" || role === "thought") {
    streamRole = role;
    streamDiv = div;
  } else {
    streamRole = null;
    streamDiv = null;
  }
}

function clearMessages() {
  messages = [];
  messagesEl.innerHTML = "";
  streamRole = null;
  streamDiv = null;
  pendingPermission = null;
  pendingEscalation = null;
  permissionBanner.style.display = "none";
  escalationBanner.style.display = "none";
}

// ---- ws plumbing -----------------------------------------------------------

function wsSend(obj) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return false;
  ws.send(JSON.stringify(obj));
  return true;
}

function init() {
  setStatus("connecting…");
  ++connGeneration;  // new generation for this connection
  ws = new WebSocket(WS_URL);
  ws.onopen = function () {
    pendingMethods = {};  // reset pending on reconnect
    setStatus("connected");
    var initId = nextId++;
    pendingMethods[initId] = "initialize";
    wsSend({ jsonrpc: "2.0", id: initId, method: "initialize", params: { protocolVersion: 1, clientCapabilities: {} } });
    // No name param -- qubi/theme without one reads the engine's live
    // active theme (~/.config/qubi/config.json's own "theme" key), same
    // theme the desktop shell is showing, not a hardcoded Ultraviolet
    // assumption. Independent of ACP init state, so fired in parallel.
    var themeId = nextId++;
    pendingMethods[themeId] = "qubi/theme";
    wsSend({ jsonrpc: "2.0", id: themeId, method: "qubi/theme", params: {} });
    refreshStatusBar();
  };
  ws.onerror = function () { setStatus("connection error"); };
  ws.onclose = function (ev) {
    connGeneration++;  // invalidate pending on disconnect
    setStatus("disconnected");
    // brief reconnect backoff
    setTimeout(init, 2000);
  };
  ws.onmessage = function (ev) {
    handleRaw(ev.data);
  };
}

function handleRaw(raw) {
  var obj;
  try { obj = JSON.parse(raw); } catch (_) { return; }
  if (!obj || typeof obj !== "object") return;

  // Agent-initiated request needing a response, not one of ours -- has an
  // id we never issued (a UUID string, not our own counter) and a method
  // name. Previously fell through every branch below and was silently
  // dropped, leaving a turn hung forever with no way to answer it.
  if (obj.method === "session/request_permission") {
    pendingPermission = obj;
    var title = (obj.params && obj.params.toolCall && obj.params.toolCall.title) || "run a tool";
    document.getElementById("permission-text").textContent = "qubi wants to: " + title;
    var optsEl = document.getElementById("permission-options");
    optsEl.innerHTML = "";
    ((obj.params && obj.params.options) || []).forEach(function (opt) {
      var btn = document.createElement("button");
      btn.textContent = opt.name || opt.optionId;
      btn.addEventListener("click", function () {
        wsSend({ jsonrpc: "2.0", id: obj.id, result: { outcome: { outcome: "selected", optionId: opt.optionId } } });
        pendingPermission = null;
        permissionBanner.style.display = "none";
      });
      optsEl.appendChild(btn);
    });
    permissionBanner.style.display = "block";
    return;
  }

  // Engine-only notification (never sent by a bare `goose acp` process) --
  // the light tier's escalate tool call, surfaced as a real choice
  // instead of the engine ever auto-switching tiers on its own.
  if (obj.method === "qubi/escalation_offer") {
    pendingEscalation = obj.params;
    document.getElementById("escalation-text").textContent = "qubi wants a bigger model: " + (obj.params.reason || "");
    escalationBanner.style.display = "block";
    return;
  }

  if (obj.method === "qubi/session_status") {
    if (obj.params && obj.params.tier && obj.params.session === currentSessionId) {
      currentTier = obj.params.tier;
      renderStatusBar();
    }
    return;
  }

  // Stale response from an old connection generation? Ignore -- the id
  // spaces don't reset across reconnects, so a late reply from a socket
  // we already abandoned could otherwise resurrect dead UI state.
  if (connGeneration === undefined) return;

  // Check if this is an error response for our initialize call
  if (obj.error && obj.id === 1) {
    showError("Initialize failed: " + JSON.stringify(obj.error));
    // still list sessions since the server is live
    resetToSessionList();
    return;
  }

  // Error response to one of our own tracked requests: recover the UI
  // instead of leaving it permanently disabled.
  if (obj.error && obj.id !== undefined && pendingMethods[obj.id]) {
    var failedMethod = pendingMethods[obj.id];
    delete pendingMethods[obj.id];
    var errText = obj.error.message || JSON.stringify(obj.error);
    if (failedMethod === "session/load") {
      showError("Couldn't load that session: " + errText);
      resetToSessionList();
    } else if (failedMethod === "session/new") {
      showError("Couldn't start a new chat: " + errText);
      resetToSessionList();
    } else if (failedMethod === "session/prompt") {
      busy = false;
      setSendReady();
      showError("Message failed: " + errText);
    } else {
      showError(failedMethod + " failed: " + errText);
    }
    return;
  }

  // Response with result to one of our own requests (no method field in response)
  if (obj.result !== undefined && obj.id !== undefined && pendingMethods[obj.id]) {
    var expectMethod = pendingMethods[obj.id];
    delete pendingMethods[obj.id];
    if (expectMethod === "initialize") {
      loadSessions();
      return;
    }
    if (expectMethod === "qubi/theme") {
      applyTheme(obj.result);
      return;
    }
    if (expectMethod === "session/list") {
      renderSessions(obj.result);
      return;
    }
    if (expectMethod === "session/load") {
      onSessionLoaded(obj.result);
      fetchSessionUsage(currentSessionId);
      return;
    }
    if (expectMethod === "session/new") {
      currentSessionId = obj.result.sessionId || "";
      currentTier = "light";
      onSessionLoaded(obj.result);
      return;
    }
    if (expectMethod === "session/prompt") {
      busy = false;
      setSendReady();
      regenerateBtn.style.display = messages.length > 0 ? "inline" : "none";
      stopBtn.style.display = "none";
      if (obj.result && obj.result.usage && typeof obj.result.usage.totalTokens === "number") {
        lastTokens = obj.result.usage.totalTokens;
        renderStatusBar();
      }
      return;
    }
    if (expectMethod === "qubi/status") {
      tierModels = {};
      var tiers = (obj.result && obj.result.tiers) || {};
      for (var t in tiers) tierModels[t] = tiers[t].model;
      if (obj.result && obj.result.defaultCwd) defaultCwd = obj.result.defaultCwd;
      var proto = obj.result && obj.result.protocol;
      if (proto && proto.major !== PROTOCOL_MAJOR)
        mcpStatus.textContent = "⚠ engine protocol " + proto.major + ", page speaks " + PROTOCOL_MAJOR;
      renderStatusBar();
      return;
    }
    if (expectMethod === "qubi/extensions") {
      lastExtensions = (obj.result && obj.result.extensions) || [];
      mcpStatus.textContent = "⚙ " + (obj.result ? obj.result.enabledCount : 0) + " MCP";
      return;
    }
    if (expectMethod === "qubi/session_usage") {
      if (obj.result && typeof obj.result.totalTokens === "number") {
        lastTokens = obj.result.totalTokens;
        renderStatusBar();
      }
      return;
    }
    if (expectMethod === "qubi/set_tier") {
      currentTier = pendingTierSwitch || currentTier;
      pendingTierSwitch = null;
      renderStatusBar();
      return;
    }
  }

  // Notification we care about during an active session
  if (obj.method && obj.method === "session/update") {
    var upd = obj.params && obj.params.update;
    if (!upd) return;
    switch (upd.sessionUpdate) {
      case "agent_message_chunk":
        addMsg("agent", upd.content ? upd.content.text : "");
        break;
      case "user_message_chunk":
        addMsg("user", upd.content ? upd.content.text : "");
        break;
      case "agent_thought_chunk":
      case "thought_message_chunk":
        // Real key is agent_thought_chunk (confirmed against the engine);
        // thought_message_chunk kept as a fallback in case an older tier
        // build still emits the name this page originally shipped with.
        addMsg("thought", upd.content ? upd.content.text : "");
        break;
      case "tool_call":
        addMsg("tool", "→ " + (upd.title || "tool call"));
        break;
      case "tool_call_update":
        if (upd.status === "completed") addMsg("tool", "✓ " + (upd.title || "tool") + " completed");
        else if (upd.status === "failed") addMsg("tool", "✗ " + (upd.title || "tool") + " failed");
        break;
      case "current_mode_update":
        break;
      default:
        break;
    }
    return;
  }

  // Handle errors not caught in the result branch
  if (obj.error && obj.id !== undefined) {
    addMsg("agent", "[Error] " + JSON.stringify(obj.error));
  }
}

// ---- status bar (MCP count, tier/model/tokens) ----------------------------

var lastExtensions = [];
var lastTokens = 0;
var pendingTierSwitch = null;

function refreshStatusBar() {
  var statusId = nextId++;
  pendingMethods[statusId] = "qubi/status";
  wsSend({ jsonrpc: "2.0", id: statusId, method: "qubi/status", params: {} });
  var extId = nextId++;
  pendingMethods[extId] = "qubi/extensions";
  wsSend({ jsonrpc: "2.0", id: extId, method: "qubi/extensions", params: {} });
}

function fetchSessionUsage(sessionId) {
  if (!sessionId) return;
  var id = nextId++;
  pendingMethods[id] = "qubi/session_usage";
  wsSend({ jsonrpc: "2.0", id: id, method: "qubi/session_usage", params: { session: sessionId } });
}

function renderStatusBar() {
  var model = tierModels[currentTier] || "";
  var tokenPart = lastTokens > 0 ? " · " + (lastTokens >= 1000 ? (lastTokens / 1000).toFixed(1) + "k" : lastTokens) : "";
  tierStatus.textContent = currentTier + (model ? " · " + model : "") + tokenPart;
}

mcpStatus.addEventListener("click", function () {
  modalBox.innerHTML = "";
  var title = document.createElement("div");
  title.className = "modal-title";
  title.textContent = lastExtensions.length + " enabled MCP extensions";
  modalBox.appendChild(title);
  if (lastExtensions.length === 0) {
    var empty = document.createElement("div");
    empty.className = "modal-row";
    empty.textContent = "None enabled";
    modalBox.appendChild(empty);
  }
  lastExtensions.forEach(function (e) {
    var row = document.createElement("div");
    row.className = "modal-row";
    row.textContent = e.name;
    modalBox.appendChild(row);
  });
  modalBackdrop.classList.add("show");
});

// Exactly the three tiers qubi/set_tier accepts (see qubi_engine.py's own
// tier table) -- not a free model list, since the engine owns one
// process per tier and has no per-request model override.
var TIERS = ["light", "heavy", "claude"];

tierStatus.addEventListener("click", function () {
  if (!currentSessionId) return;
  modalBox.innerHTML = "";
  var title = document.createElement("div");
  title.className = "modal-title";
  title.textContent = "Switch tier";
  modalBox.appendChild(title);
  TIERS.forEach(function (t) {
    var row = document.createElement("div");
    row.className = "modal-row selectable" + (t === currentTier ? " active" : "");
    var name = document.createElement("div");
    name.textContent = t;
    var sub = document.createElement("div");
    sub.className = "modal-sub";
    sub.textContent = tierModels[t] || "";
    row.appendChild(name);
    row.appendChild(sub);
    row.addEventListener("click", function () {
      closeModal();
      pendingTierSwitch = t;
      var id = nextId++;
      pendingMethods[id] = "qubi/set_tier";
      wsSend({ jsonrpc: "2.0", id: id, method: "qubi/set_tier", params: { session: currentSessionId, tier: t } });
    });
    modalBox.appendChild(row);
  });
  modalBackdrop.classList.add("show");
});

// ---- escalation banner buttons ---------------------------------------------

document.querySelectorAll("#escalation-banner [data-option]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var optionId = btn.getAttribute("data-option");
    escalationBanner.style.display = "none";
    var offer = pendingEscalation;
    pendingEscalation = null;
    if (!offer) return;
    if (optionId === "escalate_claude") {
      pendingTierSwitch = "claude";
      var id1 = nextId++;
      pendingMethods[id1] = "qubi/set_tier";
      wsSend({ jsonrpc: "2.0", id: id1, method: "qubi/set_tier", params: { session: offer.session, tier: "claude" } });
    } else if (optionId === "escalate_heavy_local") {
      pendingTierSwitch = "heavy";
      var id2 = nextId++;
      pendingMethods[id2] = "qubi/set_tier";
      wsSend({ jsonrpc: "2.0", id: id2, method: "qubi/set_tier", params: { session: offer.session, tier: "heavy" } });
    }
    // decline needs no engine call -- the offer simply isn't acted on
    // (confirmed by reading qubi_engine.py: it never expects a response).
  });
});

// ---- sessions --------------------------------------------------------------

function resetToSessionList() {
  currentSessionId = "";
  busy = false;
  clearMessages();
  showView("sessions");
  loadSessions();
}

function renderSessions(result) {
  var sessions = result.sessions || [];
  sessionList.innerHTML = "";
  if (!sessions.length) {
    var li = document.createElement("li");
    li.textContent = "No sessions yet";
    sessionList.appendChild(li);
    return;
  }
  sessions.forEach(function (s) {
    var li = document.createElement("li");
    var titleEl = document.createElement("div");
    titleEl.className = "session-title";
    titleEl.textContent = s.title || s.description || "(untitled)";
    var meta = s._meta || {};
    var metaEl = document.createElement("div");
    metaEl.className = "session-meta";
    var count = typeof meta.messageCount === "number" ? meta.messageCount + " msg" : "";
    var model = meta.modelId || "";
    var when = s.updatedAt ? formatRelativeTime(s.updatedAt) : "";
    metaEl.textContent = [count, model, when].filter(function (x) { return x; }).join(" · ");
    li.appendChild(titleEl);
    li.appendChild(metaEl);
    li.addEventListener("click", function () {
      loadSession(s.sessionId);
    });
    sessionList.appendChild(li);
  });
}

function formatRelativeTime(iso) {
  var then = new Date(iso).getTime();
  if (isNaN(then)) return "";
  var diffMin = Math.round((Date.now() - then) / 60000);
  if (diffMin < 1) return "just now";
  if (diffMin < 60) return diffMin + "m ago";
  var diffH = Math.round(diffMin / 60);
  if (diffH < 24) return diffH + "h ago";
  return Math.round(diffH / 24) + "d ago";
}

function onSessionLoaded(result) {
  busy = false;
  setSendReady();
  inputField.placeholder = "Type a message…";
  setStatus("chatting");
  tierModels = {};
  var opts = result.configOptions || [];
  regenerateBtn.style.display = "none";
  stopBtn.style.display = "none";
  refreshStatusBar();
}

function loadSessions() {
  var id = nextId++;
  pendingMethods[id] = "session/list";
  wsSend({ jsonrpc: "2.0", id: id, method: "session/list", params: {} });
}

function loadSession(sessionId) {
  hideError();
  currentSessionId = sessionId;
  currentTier = "light";
  lastTokens = 0;
  busy = true;
  clearMessages();
  showView("chat");
  setStatus("loading…");
  var id = nextId++;
  pendingMethods[id] = "session/load";
  wsSend({ jsonrpc: "2.0", id: id, method: "session/load", params: { sessionId: sessionId, cwd: defaultCwd, mcpServers: [] } });
}

function newChat() {
  hideError();
  currentTier = "light";
  lastTokens = 0;
  clearMessages();
  showView("chat");
  busy = true;
  setStatus("creating…");
  var id = nextId++;
  pendingMethods[id] = "session/new";
  wsSend({ jsonrpc: "2.0", id: id, method: "session/new", params: { cwd: defaultCwd, mcpServers: [] } });
}

// ---- composer: send / regenerate / stop / slash commands -----------------

function setSendReady() {
  sendBtn.disabled = false;
  sendBtn.classList.toggle("ready", inputField.value.trim().length > 0);
}

function autoGrow() {
  inputField.style.height = "auto";
  inputField.style.height = Math.min(inputField.scrollHeight, 120) + "px";
}

var SLASH_COMMANDS = [
  { name: "/new", help: "start a fresh conversation" },
  { name: "/history", help: "back to session list" },
  { name: "/model", help: "switch tier" },
  { name: "/mcp", help: "show MCP extensions" },
  { name: "/clear", help: "clear this transcript" }
];

function updateSlashPopup() {
  var t = inputField.value;
  if (!t.startsWith("/") || t.includes("\n") || t.includes(" ")) {
    slashPopup.style.display = "none";
    return;
  }
  var matches = SLASH_COMMANDS.filter(function (c) { return c.name.startsWith(t); });
  if (matches.length === 0) {
    slashPopup.style.display = "none";
    return;
  }
  slashPopup.innerHTML = "";
  matches.forEach(function (c) {
    var row = document.createElement("div");
    row.className = "slash-row";
    var name = document.createElement("span");
    name.className = "slash-name";
    name.textContent = c.name;
    var help = document.createElement("span");
    help.className = "slash-help";
    help.textContent = c.help;
    row.appendChild(name);
    row.appendChild(help);
    row.addEventListener("click", function () { runSlash(c.name); });
    slashPopup.appendChild(row);
  });
  slashPopup.style.display = "block";
}

function runSlash(name) {
  inputField.value = "";
  slashPopup.style.display = "none";
  autoGrow();
  setSendReady();
  switch (name) {
    case "/new": newChat(); break;
    case "/history": showView("sessions"); loadSessions(); break;
    case "/model": tierStatus.click(); break;
    case "/mcp": mcpStatus.click(); break;
    case "/clear": clearMessages(); break;
  }
}

function sendMessage() {
  var text = inputField.value.trim();
  if (!text || busy) return;
  if (text.startsWith("/") && SLASH_COMMANDS.some(function (c) { return c.name === text; })) {
    runSlash(text);
    return;
  }
  hideError();
  busy = true;
  sendBtn.disabled = true;
  addMsg("user", text);
  inputField.value = "";
  autoGrow();
  regenerateBtn.style.display = "none";
  stopBtn.style.display = "inline";
  var id = nextId++;
  pendingMethods[id] = "session/prompt";
  wsSend({ jsonrpc: "2.0", id: id, method: "session/prompt", params: { sessionId: currentSessionId, prompt: [{ type: "text", text: text }] } });
}

regenerateBtn.addEventListener("click", function () {
  var lastIdx = -1;
  for (var i = messages.length - 1; i >= 0; i--) {
    if (messages[i].role === "user") { lastIdx = i; break; }
  }
  if (lastIdx < 0) return;
  var lastUserText = messages[lastIdx].text;
  messages = messages.slice(0, lastIdx + 1);
  while (messagesEl.children.length > lastIdx + 1) {
    messagesEl.removeChild(messagesEl.lastChild);
  }
  streamRole = null;
  streamDiv = null;
  busy = true;
  setSendReady();
  regenerateBtn.style.display = "none";
  stopBtn.style.display = "inline";
  var id = nextId++;
  pendingMethods[id] = "session/prompt";
  wsSend({ jsonrpc: "2.0", id: id, method: "session/prompt", params: { sessionId: currentSessionId, prompt: [{ type: "text", text: lastUserText }] } });
});

stopBtn.addEventListener("click", function () {
  var id = nextId++;
  wsSend({ jsonrpc: "2.0", id: id, method: "session/cancel", params: { sessionId: currentSessionId } });
});

document.getElementById("new-chat-btn").addEventListener("click", newChat);

// Enter sends, Shift+Enter inserts a newline -- textarea's own default
// Enter behaviour is "insert newline", so plain Enter is intercepted and
// prevented, matching the desktop composer's TextEdit handling.
inputField.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputField.addEventListener("input", function () {
  autoGrow();
  setSendReady();
  updateSlashPopup();
});

sendBtn.addEventListener("click", sendMessage);

// kick off
init();
</script>
</body>
</html>
